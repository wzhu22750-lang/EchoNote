# EchoNote Gradle configuration.
# This machine has 8 GB RAM, so Kotlin compilation runs in-process inside the Gradle
# daemon instead of spawning a second 2 GB JVM.
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -XX:+UseParallelGC -Dfile.encoding=UTF-8
kotlin.compiler.execution.strategy=in-process
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.daemon=true
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=false
# sherpa-onnx ships prebuilt .so files; we never build native code from source.
android.defaults.buildfeatures.buildconfig=true

kotlin.code.style=official
kotlin.incremental=true
